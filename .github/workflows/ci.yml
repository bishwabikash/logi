name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # No -dev packages are installed: the windowing library loads X11,
      # Wayland and xkbcommon at run time, so a bare runner builds it. The
      # tests need no mouse; they check logic, not the device.
      # Warnings fail the build: the tree is warning-free, and this keeps it so.
      - name: Build
        run: cargo build --release --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Test
        run: cargo test --locked
        env:
          RUSTFLAGS: -D warnings

  # The manifest and README promise a minimum Rust version. This is what keeps
  # that promise honest: the number was worked out from the dependency tree and
  # has never been run on an older compiler.
  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the declared minimum toolchain
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "declared minimum: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - name: Build
        run: cargo build --locked
